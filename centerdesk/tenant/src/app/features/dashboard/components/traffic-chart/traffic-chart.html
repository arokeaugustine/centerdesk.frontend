<div class="rounded-2xl border border-gray-200 bg-white px-5 pt-5 pb-3 dark:border-gray-800 dark:bg-white/[0.03] sm:px-6 sm:pt-6">
  <div class="flex flex-wrap items-start justify-between gap-4">
    <div>
      <h3 class="text-lg font-semibold text-gray-800 dark:text-white/90">Mail Traffic</h3>
      <p class="mt-1 text-theme-sm text-gray-500 dark:text-gray-400">
        Incoming mail against replies sent, per {{ interval() }}
      </p>
    </div>

    <div class="flex items-center gap-5">
      <div class="flex items-center gap-2">
        <span class="h-2.5 w-2.5 rounded-full bg-brand-500"></span>
        <div>
          <p class="text-theme-xs text-gray-500 dark:text-gray-400">Received</p>
          <p class="text-sm font-semibold text-gray-800 dark:text-white/90">{{ totalReceived() | number }}</p>
        </div>
      </div>
      <div class="flex items-center gap-2">
        <span class="h-2.5 w-2.5 rounded-full bg-success-500"></span>
        <div>
          <p class="text-theme-xs text-gray-500 dark:text-gray-400">Responses</p>
          <p class="text-sm font-semibold text-gray-800 dark:text-white/90">{{ totalResponses() | number }}</p>
        </div>
      </div>
    </div>
  </div>

  <div class="mt-4">
    @if (hasData()) {
      <div class="-ml-4 min-w-0">
        <apx-chart
          [series]="series()"
          [chart]="chart"
          [xaxis]="xaxis()"
          [yaxis]="yaxis"
          [colors]="colors"
          [stroke]="stroke"
          [fill]="fill"
          [markers]="markers"
          [grid]="grid"
          [dataLabels]="dataLabels"
          [tooltip]="tooltip"
          [legend]="legend"
        ></apx-chart>
      </div>
    } @else {
      <p class="py-24 text-center text-sm text-gray-400 dark:text-gray-500">No mail activity in this range</p>
    }
  </div>
</div>
